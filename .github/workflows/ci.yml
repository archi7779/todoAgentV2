name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Dummy-переменные для CI: реальная БД не нужна, но Prisma/Next их требуют
  DATABASE_URL: postgresql://user:pass@localhost:5432/db
  NEXTAUTH_SECRET: dummy-secret-for-ci
  NEXTAUTH_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build