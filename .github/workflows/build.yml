name: Build and Push to GHCR

on:
  push:
    branches: [main, master]

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push app
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}
      
      - name: Build and Push migrate
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migrate
          push: true
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:migrate            
